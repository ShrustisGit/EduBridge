{% extends 'base.html' %}

{% block content %}

<div class="card">

<h2>Create Investor Account</h2>

<form method="POST">
    <input type="text"
       name="name"
       placeholder="Name"
       required>

<input type="text"
       name="company_name"
       placeholder="Company Name"
       required>

<input type="text"
       name="role"
       placeholder="Role at Company"
       required>

<!-- Email Verification -->

<div class="verify-row">

    <input type="email"
           id="email"
           name="email"
           placeholder="Company Email"
           required>

    <button type="button"
            class="verify-btn"
            onclick="sendEmailOTP()">
        Verify Email
    </button>

</div>

<div id="email-otp-box" style="display:none;">

    <input type="text"
           id="email_otp"
           placeholder="Enter Email OTP">

    <button type="button"
            class="verify-btn"
            onclick="verifyEmailOTP()">
        Submit OTP
    </button>

</div>

<input type="text"
       name="contact"
       placeholder="contact Number"
       required>

<input type="text"
       name="registration_no"
       placeholder="Company Registration Number"
       required>
<div class="location-row">

    <div class="profile-group">
        <label>🌍 Country</label>
        <select id="country"
                name="country"
               
                onchange="loadStates()">
            <option value="">Select Country</option>
            <option value="India">India</option>
            <option value="USA">USA</option>
        </select>
    </div>

    <div class="profile-group">
        <label>🏛 State</label>
        <select id="state"
                name="state"
                
                onchange="loadCities()">
            <option value="">Select State</option>
        </select>
    </div>
 <div class="profile-group">
        <label>📍 City</label>
        <select id="city"
                name="city"
                >
            <option value="">Select City</option>
        </select>
    </div>

</div>

<textarea
       name="about_company"
       placeholder="About Company"
       rows="4"
       required></textarea>

<input type="password"
       name="password"
       placeholder="Password"
       required>

<button type="submit" class="btn">
    Create Account
</button>

</form>

<p>
Already have an account?
<a href="/investor-login">
    Login
</a>
</p>

</div>

<script>

function sendEmailOTP(){

    fetch('/send-email-otp',{
        method:'POST',
        headers:{
            'Content-Type':'application/json'
        },
        body:JSON.stringify({
            email:document.getElementById('email').value
        })
    })
    .then(response => response.text())
    .then(data => {
        alert(data);
        document.getElementById('email-otp-box').style.display='flex';
    });

}

function verifyEmailOTP(){

    fetch('/verify-email-otp',{
        method:'POST',
        headers:{
            'Content-Type':'application/json'
        },
        body:JSON.stringify({
            otp:document.getElementById('email_otp').value
        })
    })
    .then(response => response.text())
    .then(data => alert(data));

}

</script>

<script>

const data = {

    India: {

        Maharashtra: [
            "Mumbai",
            "Pune",
            "Nagpur",
            "Solapur"
        ],

        Karnataka: [
            "Bangalore",
            "Mysore",
            "Hubli"
        ],

        Gujarat: [
            "Ahmedabad",
            "Surat",
            "Vadodara"
        ]

    },

    USA: {

        California: [
            "Los Angeles",
            "San Diego",
            "San Francisco"
        ],

        Texas: [
            "Houston",
            "Dallas",
            "Austin"
        ]

    }

};

function loadStates(){

    let country =
        document.getElementById("country").value;

    let state =
        document.getElementById("state");

    let city =
        document.getElementById("city");

    state.innerHTML =
        '<option value="">Select State</option>';

    city.innerHTML =
        '<option value="">Select City</option>';

    if(country){

        for(let s in data[country]){

            state.innerHTML +=
            `<option value="${s}">
                ${s}
            </option>`;
        }

    }
}

function loadCities(){

    let country =
        document.getElementById("country").value;

    let state =
        document.getElementById("state").value;

    let city =
        document.getElementById("city");

    city.innerHTML =
        '<option value="">Select City</option>';

    if(country && state){

        data[country][state].forEach(function(c){

            city.innerHTML +=
            `<option value="${c}">
                ${c}
            </option>`;

        });

    }
}

</script>

{% endblock %}
