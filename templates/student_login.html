{% extends 'base.html' %}

{% block content %}

<div class="card">

    <h2>Student Login</h2>

    <form method="POST">

        <input type="email"
               name="email"
               placeholder="Email"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <button class="btn">
            Login
        </button>

    </form>

    <p>
        Don't have an account?
        <a href="/student-signup">
            Sign Up
        </a>
    </p>

</div>

{% endblock %}
