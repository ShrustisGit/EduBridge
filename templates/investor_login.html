{% extends 'base.html' %}

{% block content %}

<div class="card">

    <h2>Investor Login</h2>

    <form method="POST">

        <input type="email"
               name="email"
               placeholder="Email Address"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <button type="submit" class="btn">
            Login
        </button>

    </form>

    <p>
        Don't have an account?
        <a href="/investor-signup">
            Create Investor Account
        </a>
    </p>

</div>

{% endblock %}
