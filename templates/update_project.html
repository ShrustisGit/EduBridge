{% extends 'base.html' %}

{% block content %}

<div class="project-form-container">
       <div class="project-card">

<div class="form-header">
    <h2>Update Project</h2>
    <p>
        Modify your project details and keep investors updated.
    </p>
</div>
<form method="POST">
<label>Project Title</label>
<input type="text"
       name="title"
       value="{{ project.title }}"
       required>

<label>Short Description</label>
<textarea
name="short_description"
required>{{ project.short_description }}</textarea>

<label>Detailed Description</label>
<textarea
name="detailed_description"
rows="8"
required>{{ project.detailed_description }}</textarea>

<label>Funding Required</label>
<input type="number"
       name="funding"
       value="{{ project.funding_required }}"
       required>

<label>Interest</label>
<input type="number"
       step="0.01"
       name="interest"
       value="{{ project.interest }}"
       required>

            <div class="form-row">

    <div class="form-group">
        <label>Months to Return Funding</label>
        <input type="number"
               name="return_months"
               placeholder="Months"
               required>
    </div>

    <div class="form-group">
        <label>Project Domain</label>

        <select name="category"
        class="domain-select"
        required>

    <option value="">Select Project Domain</option>

    <option value="Smart Agriculture & Food Systems"
    {% if project.category == 'Smart Agriculture & Food Systems' %}selected{% endif %}>
    Smart Agriculture & Food Systems
    </option>

    <option value="Disaster Management & Public Safety"
    {% if project.category == 'Disaster Management & Public Safety' %}selected{% endif %}>
    Disaster Management & Public Safety
    </option>

    <option value="Education Technology & Digital Inclusion"
    {% if project.category == 'Education Technology & Digital Inclusion' %}selected{% endif %}>
    Education Technology & Digital Inclusion
    </option>

    <option value="Social Innovation & Inclusive Technology"
    {% if project.category == 'Social Innovation & Inclusive Technology' %}selected{% endif %}>
    Social Innovation & Inclusive Technology
    </option>

    <option value="Smart Cities & Urban Innovation"
    {% if project.category == 'Smart Cities & Urban Innovation' %}selected{% endif %}>
    Smart Cities & Urban Innovation
    </option>

    <option value="Digital Healthcare & Well-being"
    {% if project.category == 'Digital Healthcare & Well-being' %}selected{% endif %}>
    Digital Healthcare & Well-being
    </option>

    <option value="Environment & Climate Sustainability"
    {% if project.category == 'Environment & Climate Sustainability' %}selected{% endif %}>
    Environment & Climate Sustainability
    </option>

    <option value="IoT Based"
    {% if project.category == 'IoT Based' %}selected{% endif %}>
    IoT Based
    </option>

    <option value="Hardware Based"
    {% if project.category == 'Hardware Based' %}selected{% endif %}>
    Hardware Based
    </option>

</select>
    </div>

</div>

<button type="submit" class="save-btn">
    💾 Save Changes
</button>
<a href="/project/{{ project.id }}"
   class="cancel-btn">
    ← Back to Project
</a>

</form>
</div>
</div>

{% endblock %}
